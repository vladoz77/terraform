packages:
- nfs-utils
- kubectl.x86_64
- kubelet.x86_64
- kubeadm.x86_64
- ipvsadm
- iscsi-initiator-utils
- nfs-utils
- nfs4-acl-tools
- cryptsetup

# Kubernetes versions
kubernetesVersion: '1.35'
kubernetesSubversion: '0'
containerd_version: '2.3.3'
interface_name: enp5s0
local_kubeconfig_dir: /home/vlad/.kube

# Proxy settings 
proxy_settings: http://10.84.101.69:10808


# Calico version
calico_version: v3.31.3
calico_encapsulation_type: NONE
goldman_enabled: false
whisker_enabled: false

# Username
username: vlad
password: '8231'

# Enabeled HA kubernetes master (true or false)
ha_enabled: false

# Ebpf mode
ebpf_enabled: false

# network config
podSubnet: 10.100.0.0/16
serviceSubnet: 10.200.0.0/16

# Select kube-proxy mode, enable ipvs or iptable (True or false)
kubeproxy_mode_ipvs: true

# Enable nodelocaldns (true or false)
nodelocaldns: false
nodelocaldns_address: 169.254.20.10

# Config container runntime
dockerhubMirror: false
dockerhubMirrorURLs:
- "https://mirror.gcr.io/v2"
